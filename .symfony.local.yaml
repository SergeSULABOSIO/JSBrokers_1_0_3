# Configuration locale de `symfony serve`.
#
# LE WORKER DE L'ASSISTANT. Sans lui, une question déposée en file n'obtient
# jamais de réponse — le chat le dit désormais (« Ket est momentanément
# indisponible… », PoulsDuWorker). Le déclarer ici, c'est laisser `symfony serve`
# le démarrer avec le serveur et le relancer à chaque modification du code.
#
# ⚠ `symfony serve` NE LE RELANCE PAS quand il s'arrête de lui-même (limite de
# durée) : mesuré le 2026-10-29, démarré à 10 h 44 min 13 s, arrêté à 11 h 44
# (`--time-limit=3600`), jamais remplacé. Le filet est la tâche planifiée Windows
# de `bin/worker-ket-dev.ps1`, qui lance la MÊME commande chaque minute ; le verrou
# de `app:ket:worker` garantit qu'il n'y en a jamais deux.
workers:
    messenger_async:
        cmd: ['symfony', 'console', 'app:ket:worker', '--time-limit=3600']
        # Redémarre le worker quand le code change : sinon il continuerait à
        # exécuter l'ancienne version, et on chercherait longtemps pourquoi un
        # correctif « ne prend pas ».
        watch: ['config', 'src', 'templates', 'vendor']
