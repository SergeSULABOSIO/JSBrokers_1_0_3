doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true

        # ── JEU DE CARACTÈRES DES TABLES CRÉÉES ─────────────────────────────
        # Le « charset » de DATABASE_URL ne règle que la CONNEXION. Ce qu'une
        # table adopte à sa création, lui, vient du défaut de la BASE — donc du
        # serveur, donc de l'hébergeur.
        #
        # Vérifié le 2026-09-13 sur joseara.com : character_set_server = latin1.
        # Or 27 de nos 53 CREATE TABLE sont écrits à la main et ne déclarent
        # aucun charset (crm_*, demande_conge, assistant_document, conges…).
        # Ils seraient nés en latin1, à côté de 26 autres en utf8mb4 — et la
        # panne n'aurait pas ressemblé à un problème d'encodage : une jointure
        # entre deux tables de collations différentes échoue sur « Illegal mix
        # of collations », loin de la table fautive.
        #
        # Déclaré ici, le jeu de caractères ne dépend plus de personne : il
        # voyage avec l'application, sur n'importe quel hébergeur.
        # utf8mb4_unicode_ci, et non general_ci : c'est déjà la collation des 26
        # tables existantes, et la seule qui trie correctement les accents.
        default_table_options:
            charset: utf8mb4
            collate: utf8mb4_unicode_ci

        # PAS de schema_filter sur messenger_messages. On a cru en avoir besoin
        # pour empêcher `migrations:diff` de proposer un DROP TABLE sur une table
        # sans entité ; vérifié le 2026-08-15, c'est faux : symfony/doctrine-messenger
        # déclare lui-même sa table au schéma (MessengerTransportDoctrineSchemaListener),
        # et `schema:update --dump-sql` ne propose rien dessus. Le filtre, lui,
        # cassait quelque chose de bien réel — il excluait la table de
        # l'introspection, donc `schema:drop --full-database` la laissait en place
        # et le `schema:create` suivant échouait sur « table already exists ».
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@dev:
    doctrine:
        orm:
            auto_generate_proxy_classes: 3  # AUTOGENERATE_FILE_NOT_EXISTS — évite les race conditions rename() sur Windows

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
