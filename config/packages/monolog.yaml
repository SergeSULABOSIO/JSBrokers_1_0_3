monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Télémétrie des tokens de l'assistant IA : une ligne JSON par tour de
        # function calling et par message. Canal SÉPARÉ pour deux raisons —
        # en dev le handler « main » écrit tout en debug (dev.log dépasse le Go
        # et rend l'agrégation impossible), et en prod il est en fingers_crossed
        # sur « error », donc ces lignes de niveau info n'y seraient JAMAIS
        # écrites. Exploité par app:assistant:tokens:rapport.
        - assistant_tokens
        # Erreurs remontées par le NAVIGATEUR d'un utilisateur, via la route de
        # collecte. Canal séparé pour qu'on puisse, si le front s'avérait trop
        # bavard, le retirer des alertes d'un mot — sans rien perdre de sa
        # journalisation ni de son comptage dans la Console.
        - navigateur

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!assistant_tokens"]
            assistant_tokens:
                type: rotating_file
                path: "%kernel.logs_dir%/assistant_tokens.log"
                level: info
                channels: [assistant_tokens]
                max_files: 14
                formatter: monolog.formatter.json
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # Aucun handler ne reprend « assistant_tokens » en test : la
                # télémétrie est vérifiée par ses tests unitaires, pas par un
                # fichier que la suite ferait grossir à chaque exécution.
                channels: ["!event", "!assistant_tokens"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ["!assistant_tokens"]
            nested:
                # FICHIER, et non « php://stderr » comme le voulait la recette.
                #
                # Sous PHP-FPM en hébergement mutualisé, stderr finit — au mieux —
                # dans le journal d'erreurs Apache du domaine, mélangé au bruit de
                # tous les autres processus du serveur, et — au pire — nulle part.
                # Or c'est le SEUL endroit où l'on saura pourquoi le site répond
                # 500, et c'est la première chose qu'on ira regarder.
                #
                # Un fichier tournant dans var/log se lit depuis le Gestionnaire de
                # fichiers de cPanel, SANS SSH. var/ étant hors racine web et le
                # .htaccess racine refusant tout, il n'est pas exposé.
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # FICHIER et non php://stderr comme le reste de la prod : c'est
            # app:assistant:tokens:rapport qui relit ces lignes pour agréger la
            # campagne de mesure — un flux sortant ne serait pas relisible.
            assistant_tokens:
                type: rotating_file
                path: "%kernel.logs_dir%/assistant_tokens.log"
                level: info
                channels: [assistant_tokens]
                max_files: 14
                formatter: monolog.formatter.json

            # ── L'ALERTE PAR E-MAIL ─────────────────────────────────────────
            # Chaîne PARALLÈLE à « main », et non greffée dessus : un échec
            # d'envoi ne doit jamais empêcher l'écriture dans prod.log. Les
            # handlers ont « bubble: true » par défaut, donc « main » continue
            # de tout recevoir quoi qu'il arrive ici.
            #
            # C'est le filet GARANTI : il ne dépend d'AUCUNE base de données, et
            # prévient donc même quand c'est MariaDB qui est tombée. Le comptage
            # de la Console, lui, suppose une base debout — les deux mécanismes
            # existent précisément parce qu'ils ne tombent pas ensemble.
            alerte:
                type: fingers_crossed
                action_level: error
                handler: alerte_protegee
                excluded_http_codes: [404, 405]
                buffer_size: 30
                # ANTI-RÉCURSION. En production, SendEmailMessage est routé
                # « sync » : un échec d'envoi est journalisé PENDANT la requête.
                # Sans ces exclusions, l'échec d'une alerte déclencherait une
                # alerte, qui échouerait à son tour.
                channels: ["!assistant_tokens", "!deprecation", "!mailer", "!messenger"]

            alerte_protegee:
                # Avale toute exception venue de la chaîne d'alerte : une panne
                # de messagerie ne doit pas transformer une erreur lisible en
                # une erreur qui parle d'autre chose.
                type: whatfailuregroup
                members: [alerte_deduplication]

            alerte_deduplication:
                type: deduplication
                handler: alerte_email
                time: 300
                # PAS le défaut (%kernel.cache_dir%) : cache:clear a lieu à
                # CHAQUE déploiement, et la mémoire des alertes serait perdue à
                # chaque fois — donc un e-mail de plus, à chaque publication,
                # pour une erreur déjà connue.
                store: '%kernel.logs_dir%/alertes-envoyees.log'

            alerte_email:
                type: symfony_mailer
                from_email: '%env(MAILER_FROM)%'
                to_email: '%env(ALERTE_EMAIL)%'
                subject: '[Joseara] %%level_name%% : %%message%%'
                level: error
                formatter: monolog.formatter.html
                content_type: text/html

            # ── LE COMPTAGE ─────────────────────────────────────────────────
            # Enregistre le défaut dans la table de supervision, visible dans la
            # Console. Déclaré en SERVICE pour capter tout ce qui est journalisé
            # en erreur — et pas seulement les exceptions non rattrapées, que
            # seul un écouteur de kernel.exception verrait. Une bonne part des
            # défauts de ce projet sont rattrapés puis journalisés ; ils comptent
            # autant.
            supervision:
                type: service
                id: App\Supervision\HandlerDeSupervision
