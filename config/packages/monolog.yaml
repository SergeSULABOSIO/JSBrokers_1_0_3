monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Télémétrie des tokens de l'assistant IA : une ligne JSON par tour de
        # function calling et par message. Canal SÉPARÉ pour deux raisons —
        # en dev le handler « main » écrit tout en debug (dev.log dépasse le Go
        # et rend l'agrégation impossible), et en prod il est en fingers_crossed
        # sur « error », donc ces lignes de niveau info n'y seraient JAMAIS
        # écrites. Exploité par app:assistant:tokens:rapport.
        - assistant_tokens

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!assistant_tokens"]
            assistant_tokens:
                type: rotating_file
                path: "%kernel.logs_dir%/assistant_tokens.log"
                level: info
                channels: [assistant_tokens]
                max_files: 14
                formatter: monolog.formatter.json
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                # Aucun handler ne reprend « assistant_tokens » en test : la
                # télémétrie est vérifiée par ses tests unitaires, pas par un
                # fichier que la suite ferait grossir à chaque exécution.
                channels: ["!event", "!assistant_tokens"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ["!assistant_tokens"]
            nested:
                # FICHIER, et non « php://stderr » comme le voulait la recette.
                #
                # Sous PHP-FPM en hébergement mutualisé, stderr finit — au mieux —
                # dans le journal d'erreurs Apache du domaine, mélangé au bruit de
                # tous les autres processus du serveur, et — au pire — nulle part.
                # Or c'est le SEUL endroit où l'on saura pourquoi le site répond
                # 500, et c'est la première chose qu'on ira regarder.
                #
                # Un fichier tournant dans var/log se lit depuis le Gestionnaire de
                # fichiers de cPanel, SANS SSH. var/ étant hors racine web et le
                # .htaccess racine refusant tout, il n'est pas exposé.
                type: rotating_file
                path: "%kernel.logs_dir%/prod.log"
                max_files: 14
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # FICHIER et non php://stderr comme le reste de la prod : c'est
            # app:assistant:tokens:rapport qui relit ces lignes pour agréger la
            # campagne de mesure — un flux sortant ne serait pas relisible.
            assistant_tokens:
                type: rotating_file
                path: "%kernel.logs_dir%/assistant_tokens.log"
                level: info
                channels: [assistant_tokens]
                max_files: 14
                formatter: monolog.formatter.json
