vich_uploader:
  db_driver: orm

  mappings:
    # LES PIÈCES DÉPOSÉES (Document) — HORS de public/ (chantier 18) : aucune URL ne les
    # atteint ; seules les routes contrôlées les servent (ReponseDePiece). `uri_prefix` n'est
    # là que parce que Vich l'exige : aucune page ne doit construire cette adresse.
    piece_sinistre_documents:
      uri_prefix: /_prive/pieces
      upload_destination: "%app.dossier_des_pieces%"
      namer: App\Service\Document\NomAleatoire

    # LES LOGOS des cabinets : publics (montrés par <img>), dans leur propre dossier, séparé
    # des images de marque suivies par git ; noms aléatoires.
    entreprises:
      uri_prefix: /uploads/logos
      upload_destination: "%app.dossier_des_logos%"
      namer: App\Service\Document\NomAleatoire

      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true

    # Fichiers attachés au chat de l'assistant IA (Ket). Stockés HORS public/
    # (uploads utilisateur arbitraires) : jamais servis directement par URL,
    # seulement via la route de téléchargement fail-closed du contrôleur IA.
    assistant_fichiers:
      uri_prefix: /_private/assistant
      upload_destination: "%kernel.project_dir%/var/uploads/assistant"
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true

    # Documents PRODUITS par Ket (Word, Excel, PDF, Markdown, texte, HTML). Même
    # régime que les pièces jointes — HORS public/, servis uniquement par la route
    # de téléchargement fail-closed du contrôleur IA. Ils ont été payés en tokens :
    # ils sont conservés tant que vit la conversation qui les a produits.
    assistant_documents:
      uri_prefix: /_private/assistant-documents
      upload_destination: "%kernel.project_dir%/var/uploads/assistant-documents"
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer

      inject_on_load: false
      delete_on_update: true
      delete_on_remove: true
