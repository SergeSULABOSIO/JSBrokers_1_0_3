framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # use_notify est une option PostgreSQL (LISTEN/NOTIFY). La base
                    # est MariaDB : le transport retombe sur son propre scrutin,
                    # d'environ une seconde. Négligeable devant un traitement de
                    # vingt à quarante secondes. Laissé en place — la bascule
                    # PostgreSQL du compose.yaml le rendrait vrai.
                    use_notify: true
                    check_delayed_interval: 60000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\EntreprisePDFMessage: async

            # Traitement d'un message de l'assistant IA. Le routage vers `async`
            # n'est PAS ce qui décide du régime : FileDeTraitement estampille
            # l'enveloppe pour `sync` tant que ASSISTANT_ASYNC vaut 0. C'est cette
            # variable, et elle seule, qui bascule — ici on ne fait que déclarer
            # où le signal ira quand elle passera à 1.
            App\Message\TraiterMessagesAssistant: async

            # Un palier d'importation. Comme ci-dessus, le routage ne décide de rien :
            # `FileDImport` ne dispatche que si IMPORT_ASYNC vaut 1. À 0, aucun message
            # n'est émis du tout — c'est le navigateur qui rappelle, palier par palier.
            # ⚠ ET LE HANDLER SE REDISPATCHE : un message = UN palier. Boucler dans le
            # worker accumulerait la rétention mémoire du contrôle à blanc, et le ferait
            # mourir exactement là où mourait la requête qu'on a supprimée.
            App\Message\AvancerUnPalierDImport: async

            # Route your messages to the transports
            # 'App\Message\YourMessage': async

# PAS de routage `sync` pour l'assistant sous PHPUnit. Ce serait un SECOND
# mécanisme de bascule, en concurrence avec ASSISTANT_ASYNC — et le routage
# gagnerait, rendant le drapeau intestable. Le drapeau vaut 0 en test comme
# ailleurs : le drainage a donc lieu pendant le dispatch, l'envoi rend 200 avec
# la charge utile complète, et les tests d'envoi existants restent valables mot
# pour mot. AssistantRafaleTest, lui, pose le drapeau à 1 pour observer la file.

when@dev:
    framework:
        messenger:
            routing:
                # En dev, on envoie les emails de façon SYNCHRONE : ils partent pendant la
                # requête qui les déclenche et apparaissent aussitôt dans le panneau « E-mails »
                # du profiler Symfony — aucun worker à lancer. Couplé à MAILER_DSN=null://null
                # (.env.dev), l'envoi est un no-op inoffensif (pas de SMTP requis, pas d'échec).
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync

when@prod:
    framework:
        messenger:
            routing:
                # ── POURQUOI « sync » ET NON « async » EN PRODUCTION ─────────────────
                # L'hébergement est MUTUALISÉ : aucun superviseur (systemd, supervisor)
                # n'y maintient de worker vivant. Le seul substitut possible est un cron
                # périodique — ce qui ferait attendre PLUSIEURS MINUTES le lien de
                # vérification d'une inscription, une invitation de collaborateur, un
                # lien de relevé envoyé à un client. Pour ces messages-là, c'est
                # inacceptable : l'utilisateur est devant son écran et conclut que
                # l'inscription est cassée.
                #
                # Pire encore : sans worker du tout — l'état par défaut d'un mutualisé —
                # « async » ne retarde pas les e-mails, il les PERD DE VUE. Ils
                # s'accumulent indéfiniment dans messenger_messages, sans erreur, sans
                # trace, sans que personne ne s'en aperçoive.
                #
                # En « sync », l'e-mail part PENDANT la requête : s'il échoue, on le sait
                # tout de suite, au bon endroit, avec la bonne exception.
                #
                # ── CE QUE ÇA COÛTE ─────────────────────────────────────────────────
                # La requête qui déclenche un envoi porte la latence SMTP. Les actions
                # concernées sont rares (inscription, invitation, envoi de relevé) et
                # l'utilisateur les vit comme des actions « lourdes » de toute façon.
                #
                # ── COMMENT REVENIR EN ARRIÈRE ──────────────────────────────────────
                # Le jour où un worker fiable existera (VPS, systemd, supervisor), il
                # suffira de SUPPRIMER ce bloc entier : le routage « async » déclaré
                # plus haut reprendra la main, sans aucun autre changement.
                Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
                Symfony\Component\Notifier\Message\ChatMessage: sync
                Symfony\Component\Notifier\Message\SmsMessage: sync

                # Esquisse non implementee (voir EntreprisePDFMessageHandler). En
                # « async » sans worker, ce message s'empilerait indefiniment dans
                # messenger_messages sans que personne ne s'en apercoive.
                App\Message\EntreprisePDFMessage: sync
