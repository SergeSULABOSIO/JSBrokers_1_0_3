twig:
    file_name_pattern: '*.twig'
    form_themes: ['bootstrap_5_layout.html.twig']
    paths:
        # Namespace permettant d'embarquer les images (logo) dans les e-mails via
        # email.image('@images/...') : la fonction résout le fichier par le loader Twig.
        '%kernel.project_dir%/public/images': images
        # Dépendances front téléchargées par « importmap:install » et VERSIONNÉES
        # (voir le commentaire du .gitignore). Déclarées en chemin Twig pour
        # pouvoir en INCORPORER le contenu dans les documents produits côté
        # serveur — un PDF ne doit jamais dépendre d'un CDN au moment du rendu.
        '%kernel.project_dir%/assets/vendor': assetsvendor

when@test:
    twig:
        strict_variables: true
