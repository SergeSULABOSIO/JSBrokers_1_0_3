parameters:
    # ==================================================================
    # CONFIGURATION DU MENU DE L'ESPACE DE TRAVAIL
    # ==================================================================
    # Ce fichier centralise la structure du menu principal.
    # Le contrôleur EspaceDeTravailComponentController injecte ce paramètre
    # pour construire le menu dynamiquement.
    #
    # Structure :
    #   - icone: Nom de l'icône (compatible ux.symfony.com/icons).
    #   - nom: Libellé affiché dans le menu.
    #   - description: Texte affiché au survol.
    #   - composant_twig: Template Twig à charger pour cette rubrique.
    #   - entity_name: (Optionnel) Classe de l'entité gérée par la rubrique.
    # ==================================================================
    app.menu_data:
        colonne_1:
            tableau_de_bord:
                icone: 'dashboard'
                nom: 'Tableau de bord'
                description: "<p>Visualisez les indicateurs clés de performance de votre cabinet en temps réel. Le tableau de bord centralise les données essentielles pour un pilotage stratégique et immédiat.</p><p>Suivez l'évolution de vos primes, commissions, et sinistres grâce à des graphiques intuitifs. Anticipez les tendances et réagissez rapidement aux opportunités ou aux risques.</p><p><strong>Le tableau de bord est votre tour de contrôle. Il transforme les données brutes en intelligence décisionnelle pour une croissance maîtrisée.</strong></p>"
                composant_twig: '_tableau_de_bord_component.html.twig'

            groupes:
                Finances:
                    icone: 'monnaie'
                    description: "<p>Gérez vos flux financiers, des primes aux commissions. Suivez chaque transaction avec une précision et une facilité inégalées.</p><p>Obtenez une vision claire de votre rentabilité. Prenez des décisions éclairées basées sur des données financières fiables et à jour.</p><p><strong>Maîtriser vos finances est le pilier de votre croissance. C'est la garantie de votre pérennité et de votre succès.</strong></p>"
                    rubriques:
                        "Monnaies": { icone: 'monnaie', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Monnaie' }
                        "Comptes bancaires": { icone: 'compte-bancaire', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\CompteBancaire' }
                        "Taxes": { icone: 'taxe', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Taxe' }
                        "Types Revenus": { icone: 'type-revenu', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\TypeRevenu' }
                        "Tranches": { icone: 'tranche', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Tranche' }
                        "Types Chargements": { icone: 'chargement', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Chargement' }
                        "Notes": { icone: 'note', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Note' }
                        "Paiements": { icone: 'paiement', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Paiement' }
                        "Bordereaux": { icone: 'bordereau', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Bordereau' }
                        "Revenus": { icone: 'revenu', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\RevenuPourCourtier' }
                        "Charges": { icone: 'charge', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\ChargeCourtier' }
                        # Rétrocommissions REVERSÉES aux agents INTERNES : rubrique de
                        # CONSULTATION (la création est refusée par son canevas — un versement
                        # s'enregistre depuis le rapport de production ou par l'assistant, avec
                        # son justificatif du même geste). Un décaissement se cherche dans les
                        # Finances, et le droit qui la gouverne s'y règle aussi.
                        #
                        # « Rétros agents » et non l'intitulé complet : cette clé EST le
                        # libellé affiché, au menu comme en titre d'onglet, où
                        # « Reversements de rétrocommission » se tronquait en
                        # « Reversements d… ». L'ancien terme reste compris de
                        # l'assistant (WorkspaceAccessResolver::ALIAS).
                        "Rétros intermédiaires": { icone: 'depense', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\ReversementRetroAgent' }
                        "Fournisseurs": { icone: 'fournisseur', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\Fournisseur' }
                        "Dépenses": { icone: 'depense', composant_twig: '_view_manager.html.twig', entity_name: 'App\Entity\DepenseCourtier' }
                        # Rubrique SANS entité Doctrine : 'DocumentComptable' est une PSEUDO-entité
                        # (documents générés à la volée). Elle sert uniquement au gating du menu
                        # (WorkspaceAccessResolver::MAP → RolesEnFinance::accessDocumentComptable).
                        # Ne JAMAIS créer une vraie classe App\Entity\DocumentComptable sans revisiter
                        # processDataForShortEntityNames (garde class_exists) et cette rubrique.
                        "Documents comptables": { icone: 'document-comptable', composant_twig: '_document_comptable_component.html.twig', entity_name: 'DocumentComptable' }

                Marketing:
                    icone: 'piste'
                    description: "<p>Transformez vos prospects en clients fidèles. Pilotez vos campagnes, suivez vos pistes et organisez vos tâches commerciales efficacement.</p><p>Gagnez en productivité et ne manquez plus aucune opportunité. Votre pipeline commercial est clair, optimisé et sous contrôle.</p><p><strong>Un marketing structuré est votre meilleur atout pour acquérir de nouveaux marchés et vous démarquer de la concurrence.</strong></p>"
                    rubriques:
                        "Pistes": { icone: 'piste', composant_twig: '_view_manager_marketing.html.twig', entity_name: 'App\Entity\Piste' }
                        "Tâches": { icone: 'tache', composant_twig: '_view_manager_marketing.html.twig', entity_name: 'App\Entity\Tache' }
                        "Feedbacks": { icone: 'feedback', composant_twig: '_view_manager_marketing.html.twig', entity_name: 'App\Entity\Feedback' }

                Production:
                    icone: 'cotation'
                    description: "<p>Centralisez la gestion de vos polices, clients et partenaires. De la cotation à l'avenant, tout est à portée de clic.</p><p>Simplifiez vos opérations quotidiennes et offrez un service client réactif. Votre production devient fluide, rapide et sans erreur.</p><p><strong>L'excellence opérationnelle en production est le cœur de votre métier. Elle fidélise vos clients et renforce votre réputation.</strong></p>"
                    rubriques:
                        "Groupes": { icone: 'groupe', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Groupe' }
                        "Portefeuilles": { icone: 'portefeuille', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Portefeuille' }
                        "Clients": { icone: 'client', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Client' }
                        'Assureurs': { icone: 'assureur', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Assureur' }
                        "Contacts": { icone: 'contact', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Contact' }
                        "Risques": { icone: 'risque', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Risque' }
                        "Avenants": { icone: 'avenant', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Avenant' }
                        "Intermédiaires": { icone: 'partenaire', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Partenaire' }
                        # Règles de rétrocommission, partenaires EXTERNES comme agents INTERNES.
                        # Elles n'avaient aucune porte d'entrée : on ne pouvait les créer que
                        # depuis la collection d'un partenaire (qui impose un partenaire) ou
                        # d'une piste (qui les lie à cette seule piste). Une règle d'agent, qui
                        # se veut réutilisable sur toutes ses affaires, n'était donc créable
                        # que par l'assistant. Elle a aussi sa valeur propre : c'est l'écran où
                        # l'on audite les taux en vigueur.
                        "Conditions de partage": { icone: 'condition', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\ConditionPartage' }
                        "Propositions": { icone: 'cotation', composant_twig: '_view_manager_production.html.twig', entity_name: 'App\Entity\Cotation' }
                        # PSEUDO-entité 'ProductionIntermediaire' (pattern DocumentComptable) :
                        # la production d'un agent interne ou d'un partenaire externe se
                        # calcule par le MOTEUR de partage, cotation par cotation — il n'y a
                        # donc aucune classe Doctrine à lister, et la rubrique n'existe que
                        # pour le gating du menu et le routage du composant.
                        # Elle remplace le rapport de production, qui ne s'ouvrait que par la
                        # porte d'une fiche et ne se situait nulle part dans l'arbre.
                        "Production intermédiaires": { icone: 'invite', composant_twig: '_view_manager_production.html.twig', entity_name: 'ProductionIntermediaire' }

                Sinistre:
                    icone: 'sinistre'
                    description: "<p>Suivez chaque dossier sinistre, de la notification au règlement. Gérez les pièces, les offres et les paiements simplement.</p><p>Accélérez le traitement des sinistres et améliorez la satisfaction de vos assurés. Votre gestion est transparente et efficace.</p><p><strong>Une gestion des sinistres performante est cruciale. Elle prouve votre valeur ajoutée et la fiabilité de votre service.</strong></p>"
                    rubriques:
                        "Types pièces": { icone: 'modele-piece', composant_twig: '_view_manager_sinistre.html.twig', entity_name: 'App\Entity\ModelePieceSinistre' }
                        "Pièces Sinistre": { icone: 'piece-sinistre', composant_twig: '_view_manager_sinistre.html.twig', entity_name: 'App\Entity\PieceSinistre' }
                        "Notifications": { icone: 'sinistre', composant_twig: '_view_manager_sinistre.html.twig', entity_name: 'App\Entity\NotificationSinistre' }
                        "Règlements": { icone: 'offre', composant_twig: '_view_manager_sinistre.html.twig', entity_name: 'App\Entity\OffreIndemnisationSinistre' }

                Administration:
                    icone: 'document'
                    description: "<p>Organisez vos documents, gérez les accès et les congés de vos collaborateurs, et sécurisez vos données. Votre cabinet est parfaitement structuré.</p><p>Collaborez en toute sérénité et retrouvez n'importe quelle information en un instant. Votre administration est simplifiée et sécurisée.</p><p><strong>Une administration rigoureuse est le socle de votre conformité et de votre efficacité. Elle protège votre activité.</strong></p>"
                    rubriques:
                        Documents: { icone: 'document', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\Document' }
                        Classeurs: { icone: 'classeur', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\Classeur' }
                        Invités: { icone: 'invite', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\Invite' }
                        # ── CONGÉS ────────────────────────────────────────────────────
                        # « Congés » porte les demandes ; les deux rubriques suivantes ne
                        # sont que son paramétrage et partagent un droit distinct
                        # (RolesEnAdministration::accessCongeParametre) — on peut confier
                        # la validation des demandes sans ouvrir le réglage des droits à
                        # congé, qui engage le cabinet bien au-delà d'un dossier.
                        #
                        # Sur « Congés », le niveau MODIFICATION fait le VALIDEUR : il
                        # ouvre la décision ET la vue sur les demandes de tout le cabinet.
                        # En deçà, le collaborateur ne voit que les siennes.
                        "Congés": { icone: 'conge', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\DemandeConge' }
                        "Types d'absence": { icone: 'type-absence', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\TypeAbsence' }
                        "Jours fériés": { icone: 'jour-ferie', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\JourFerie' }
                        # Les réglages qui gouvernent les contrôles de la soumission :
                        # préavis, absents simultanés, périodes de blocage, dotation,
                        # relances. Même droit que les deux rubriques ci-dessus.
                        "Paramètres congés": { icone: 'action:settings', composant_twig: '_view_manager_administration.html.twig', entity_name: 'App\Entity\ParametresConge' }
                        # ── ÉCHANGE DE DONNÉES ────────────────────────────────────────
                        # Rubrique OUTIL (pas de liste d'entité) : entity_name porte donc un
                        # nom court EN CLAIR, la pseudo-entité « Echange », comme le font déjà
                        # « DocumentComptable » et « AssistantIa ». La garde class_exists de
                        # processDataForShortEntityNames la laisse passer telle quelle.
                        #
                        # Le libellé est volontairement court : « Importation / Exportation des
                        # données » se tronquerait dans un onglet.
                        "Importation / Exportation": { icone: 'echange', composant_twig: '_echange_component.html.twig', entity_name: 'Echange' }

                IA:
                    icone: 'assistant-ia'
                    description: "<p>Votre assistant IA connaît les données de votre espace de travail et répond à vos questions en langage naturel, dans les limites de votre périmètre d'accès.</p><p>Comptages, indicateurs calculés, périmètre : demandez-lui, il va chercher l'information à votre place.</p><p><strong>Un collaborateur infatigable, qui connaît votre cabinet dans les moindres détails et respecte vos droits d'accès.</strong></p>"
                    rubriques:
                        # PSEUDO-entité 'AssistantIa' (pattern DocumentComptable) : la rubrique
                        # n'apparaît que si l'invité a la Lecture du module IA
                        # (RolesEnAdministration::accessAssistantIa) — propriétaire toujours.
                        # Les données restent de toute façon fail-closed outil par outil.
                        "Assistant": { icone: 'assistant-ia', composant_twig: '_assistant_ia_component.html.twig', entity_name: 'AssistantIa' }
                        # Paramètres (nom du personnage) : gatés comme la gestion des invités
                        # (WorkspaceAccessResolver::ROLE_MANAGEMENT_ENTITIES → canManageInvites).
                        "Paramètres IA": { icone: 'assistant-ia-parametres', composant_twig: '_assistant_ia_parametres_component.html.twig', entity_name: 'App\Entity\AssistantParametres' }

                Assistance:
                    icone: 'feedback'
                    description: "<p>Besoin d'aide ? Ouvrez une demande de support et suivez son traitement par l'équipe JS Brokers, sans quitter votre espace de travail.</p><p>Décrivez votre situation et son urgence : notre équipe la prend en charge et vous tient informé de son avancement.</p><p><strong>Un support réactif, au cœur de votre outil. Vous n'êtes jamais seul.</strong></p>"
                    rubriques:
                        "Support": { icone: 'feedback', composant_twig: '_support_component.html.twig' }

            # NOUVEAU : Le groupe Paramètres est extrait pour un positionnement spécial.
            parametres_group:
                nom: 'Paramètres'
                icone: 'action:settings'
                description: "<p>Configurez les aspects fondamentaux de votre espace de travail : informations de l'entreprise, coordonnées, paramètres généraux.</p><p>L'accès à l'édition de l'entreprise est réservé à son administrateur (le propriétaire du compte). Les invités peuvent visualiser ce groupe mais ne peuvent pas le modifier.</p><p><strong>Les paramètres sont le centre névralgique de votre application. Prenez le temps de les ajuster pour une efficacité maximale.</strong></p>"
                rubriques: {}

            # NOUVEAU : Bouton de déconnexion, positionné tout en bas de la colonne 1.
            deconnexion:
                icone: 'action:exit'
                nom: 'Fermer'
                description: "<p>Cliquez ici pour <strong>fermer l'espace de travail de cette entreprise</strong> et revenir à votre liste d'entreprises.</p><p>Vous restez connecté à l'application : vous pourrez rouvrir cette entreprise ou en ouvrir une autre. Pensez à enregistrer vos modifications en cours avant de partir.</p><p><strong>Pour vous déconnecter complètement, utilisez le bouton « Déconnexion » depuis la liste des entreprises.</strong></p>"
        colonne_2:
            logo: 'images/entreprises/logofav.png'
            titre: 'JS Brokers'
            description: "Votre partenaire fiable pour optimiser la gestion de votre porte-feuille client."
            version: '1.1.0'