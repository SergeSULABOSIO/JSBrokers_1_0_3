# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Adresse expéditeur unique pour tous les emails sortants (vérification, invitations…).
    app.mail_from: '%env(MAILER_FROM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $mailFrom: '%app.mail_from%'
            # Référence Twig du logo (namespace « images »), embarqué en inline (CID) dans
            # les e-mails via email.image(). Le « @@ » échappe le « @ » littéral en YAML
            # de services (sinon interprété comme une référence de service).
            string $logoPath: '@@images/entreprises/logofav.png'
            # Secret de vérification des signatures de webhook de paiement. Repli sur
            # APP_SECRET tant qu'aucun PSP réel (avec sa propre clé) n'est branché.
            string $paymentWebhookSecret: '%env(APP_SECRET)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Correction pour l'injection du menu dans EspaceDeTravailComponentController
    App\Controller\EspaceDeTravailComponentController:
        arguments:
            $menuData: '%app.menu_data%'

    # ... (votre configuration existante)

    # Taggage automatique pour les fournisseurs de canevas
    _instanceof:
        # Pour les canevas de LISTE
        App\Services\Canvas\Provider\List\ListCanvasProviderInterface:
            tags: ['app.list_canvas_provider']

        # Pour les canevas de ENTITY
        App\Services\Canvas\Provider\Entity\EntityCanvasProviderInterface:
            tags: ['app.entity_canvas_provider']

        # Pour les canevas de FORM (Correction du namespace de l'interface)
        App\Services\Canvas\Provider\Form\FormCanvasProviderInterface:
            tags: ['app.form_canvas_provider']

        # NOUVEAU : Pour les canevas NUMERIC
        App\Services\Canvas\Provider\Numeric\NumericCanvasProviderInterface:
            tags: ['app.numeric_canvas_provider']

        # NOUVEAU : Pour les stratégies de calcul d'indicateurs
        App\Services\Canvas\Indicator\IndicatorCalculationStrategyInterface:
            tags: ['app.indicator_calculation_strategy']

        # Outils de données de l'assistant IA (consommés par le moteur via
        # AutowireIterator, exposables en tool-calling au futur LLM réel).
        App\Ai\Tool\AiToolInterface:
            tags: ['app.ai_tool']

        # Rendus des DOCUMENTS produits par Ket, un par format (Word, Excel, PDF,
        # Markdown, texte, HTML). Retrouvés par RapportRendererResolver : ajouter un
        # format se fait en ajoutant une classe, jamais en modifiant une liste.
        App\Ai\Document\Renderer\RapportRendererInterface:
            tags: ['app.ai_document_renderer']

        # Vérificateurs d'EFFET MÉTIER du rapport final d'un programme : au-delà de
        # « la ligne est bien en base », ils répondent « la conséquence attendue
        # s'est-elle produite ? » (une prime signalée est-elle réellement soldée ?).
        App\Ai\Programme\EffetMetierVerifieur:
            tags: ['app.ai_effet_metier']

    # Moteur de l'assistant IA : le résolveur choisit à l'exécution — clé
    # ANTHROPIC_API_KEY renseignée → moteur réel API Claude (AnthropicAiEngine),
    # sinon simulateur déterministe (dev/test sans réseau ni secret). Même
    # pattern d'alias swappable que le PSP de paiement ci-dessous.
    App\Ai\Engine\AiEngineInterface: '@App\Ai\Engine\AiEngineResolver'

    # La phase de COMPRÉHENSION suit le même fournisseur que le moteur de texte.
    # Elle parlait à Google en direct quelle que soit la clé posée : une
    # « alternative à Gemini » qui exige quand même une clé Gemini n'en est pas une.
    App\Ai\Comprehension\AppelDeComprehension: '@App\Ai\Comprehension\AppelResolver'

    # La FINITION DE DICTÉE suit la même règle : un cabinet qui tourne sur Claude
    # n'a aucune raison de garder une clé Gemini pour que sa dictée soit mise au
    # propre.
    App\Ai\Dictee\AppelDeFinition: '@App\Ai\Dictee\FinitionResolver'

    # ── LE DÉBIT NE SE COMPTE PAS PAREIL CHEZ LES DEUX FOURNISSEURS ──────────
    #
    # BudgetDebit tire son plafond de GEMINI_TPM_PLAFOND — une variable que les
    # deux commandes de mesure lisent telle quelle, et qu'on ne renomme donc pas.
    # Mais Anthropic ne compte ni la même chose ni au même endroit : deux plafonds
    # séparés (entrée et sortie), et les tokens LUS EN CACHE exclus du décompte,
    # ce qui rend son plafond d'entrée huit fois plus haut. Lui opposer celui de
    # Google ferait patienter Ket devant une porte grande ouverte.
    #
    # Le compteur porte donc un préfixe dans sa clé, et c'est le préfixe qui
    # choisit le plafond. Une clé sans préfixe connu — tous les modèles Gemini —
    # retombe sur le défaut : rien ne change pour l'existant.
    App\Ai\Debit\BudgetDebit:
        arguments:
            $plafondsParPrefixe:
                'anthropic:in:': '%env(int:ANTHROPIC_ITPM_PLAFOND)%'
                'anthropic:out:': '%env(int:ANTHROPIC_OTPM_PLAFOND)%'

    # PSP de paiement : implémentation par défaut = simulateur (repli/tests). Le
    # jour où un PSP réel est choisi, on ajoute son adaptateur et on repointe cet
    # alias dessus — aucun autre changement applicatif.
    App\Payment\Gateway\PaymentGatewayInterface: '@App\Payment\Gateway\SimulatedGateway'

    # ── LA MÉMOIRE D'ÉPUISEMENT NE VIT PAS DANS var/cache ────────────────────
    #
    # Elle retient qu'un fournisseur s'est déclaré à sec — crédits du mois
    # ElevenLabs, quota du jour Gemini, plafond de dépense mensuel Anthropic — pour
    # ne pas lui refaire un aller-retour perdu à chaque tour. Née pour la voix, elle
    # sert désormais les CINQ familles ; l'identifiant du service et le dossier
    # gardent leur nom d'origine, parce que le renommer effacerait les marques en
    # cours. Rangée dans « cache.app », elle disparaissait à chaque DÉPLOIEMENT :
    # « cache:clear » est la première chose que fait bin/deploy.sh, et le pool
    # « app » vit sous var/cache/<env>/pools. Après chaque mise en ligne, la
    # première lecture repayait donc quatre refus réseau avant le premier mot.
    #
    # C'est exactement le piège n°2 de la supervision (son store de déduplication
    # a dû quitter cache_dir pour la même raison) : une mémoire dont la perte ne
    # casse rien et ne se voit pas. Elle rejoint donc var/ket-voix/, où vivent
    # déjà les enregistrements — un dossier que le déploiement ne touche jamais.
    ket.voix.memoire_epuisement:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            - 'ket_voix_epuise'
            - 0
            - '%kernel.project_dir%/var/ket-voix/epuisement/%kernel.environment%'

    App\Ai\Fournisseur\MemoireDEpuisement:
        arguments:
            $cache: '@ket.voix.memoire_epuisement'

    # NOUVEAU : Décorateur pour le PropertyAccessor du Sérialiseur.
    # Cela permet d'intercepter les exceptions Doctrine (EntityNotFoundException)
    # lors de la sérialisation de relations rompues, sans faire planter l'application.
    App\Serializer\SafePropertyAccessor:
        # On décore le service principal 'property_accessor' pour que la correction
        # s'applique à la fois au Sérialiseur ET au composant Formulaire.
        decorates: 'property_accessor'
        arguments: ['@App\Serializer\SafePropertyAccessor.inner']
        public: false
