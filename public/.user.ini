; =============================================================================
;  JOSEARA — EXIGENCES PHP DE L'APPLICATION
; -----------------------------------------------------------------------------
;  PHP lit ce fichier quand il tourne en CGI / FastCGI / LSAPI — c'est le cas de
;  joseara.com (SAPI « litespeed »). Il s'applique à ce dossier et à tout ce
;  qu'il contient ; comme la racine de document est « public/ », il couvre toute
;  l'application.
;
;  ── POURQUOI ICI, ET PAS SEULEMENT DANS LE PANNEAU ─────────────────────────
;  Le sélecteur PHP de CloudLinux n'expose qu'une PARTIE des directives, et
;  « max_input_vars » n'en fait pas partie. Mais il y a mieux qu'un contournement
;  dans cette solution : les besoins PHP de l'application sont désormais ÉCRITS
;  DANS L'APPLICATION, versionnés, et déployés avec elle. Ils survivent à un
;  changement d'hébergeur, à une réinitialisation du panneau, et à l'oubli de
;  celui qui installera la prochaine instance.
;  Le panneau reste utile : ce qu'on y pose fait foi si l'hébergeur interdit
;  d'abaisser ou de relever une valeur ici.
;
;  ── DÉLAI ───────────────────────────────────────────────────────────────────
;  PHP met ce fichier en cache pendant « user_ini.cache_ttl » secondes (300 par
;  défaut). Une modification peut donc mettre jusqu'à CINQ MINUTES à prendre
;  effet — ne pas conclure trop vite qu'elle est ignorée.
;
;  ⚠ Le .htaccess voisin refuse tout fichier commençant par un point : celui-ci
;    n'est donc jamais servi par HTTP.
; =============================================================================

; LE RÉGLAGE QUI JUSTIFIE CE FICHIER.
; Les formulaires « canevas » de Joseara envoient beaucoup de champs. Au-delà de
; cette limite, PHP TRONQUE LE POST EN SILENCE : l'enregistrement perd des
; données, sans erreur à l'écran ni dans les journaux. C'est la panne la plus
; difficile à diagnostiquer de toute l'installation, parce qu'elle ressemble à
; une faute de saisie de l'utilisateur.
max_input_vars = 5000

; Exports Excel et imports par paliers : le contrôle à blanc d'une reprise
; retient plusieurs mégaoctets par ligne avant de rendre quoi que ce soit.
memory_limit = 512M

; Un import volumineux ou un gros PDF dépasse les 30 secondes par défaut.
max_execution_time = 120
max_input_time = 120

; Bordereaux et pièces jointes du chat.
upload_max_filesize = 32M
; DOIT dépasser upload_max_filesize : la requête transporte le fichier PLUS les
; champs du formulaire. À valeur égale, un fichier de 32 Mo est rejeté — et le
; message d'erreur, lui, parle du POST, pas du fichier.
post_max_size = 48M
